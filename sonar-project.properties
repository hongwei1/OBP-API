# The five *.scala files below are code.bankconnectors.generator.ConnectorBuilderUtil output,
# not hand-written: each implements the same ~150-method Connector interface for a different
# wire protocol, so the same method bodies are structurally repeated across all five products by
# design. CPD flags that repetition as duplication (71% density in AkkaConnector_vDec2018.scala
# alone) — a real signal for hand-written code, noise for a generator whose whole point is
# emitting the same shape five times.
sonar.cpd.exclusions=obp-api/src/test/**/*.scala,obp-api/src/test/**/*.java,\
  obp-api/src/main/scala/code/bankconnectors/grpc/GrpcConnector_vFeb2026.scala,\
  obp-api/src/main/scala/code/bankconnectors/rabbitmq/RabbitMQConnector_vOct2024.scala,\
  obp-api/src/main/scala/code/bankconnectors/rest/RestConnector_vMar2019.scala,\
  obp-api/src/main/scala/code/bankconnectors/akka/AkkaConnector_vDec2018.scala,\
  obp-api/src/main/scala/code/bankconnectors/storedprocedure/StoredProcedureConnector_vDec2019.scala

# JSON wire-format case classes (JSONFactory*) use snake_case field names by
# API contract — json4s serializes the field names verbatim, so renaming them
# to satisfy the scala naming rule (S117) would change the JSON on the wire.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=scala:S117
sonar.issue.ignore.multicriteria.e1.resourceKey=**/JSONFactory*.scala

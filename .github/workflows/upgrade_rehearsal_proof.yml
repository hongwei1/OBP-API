name: Upgrade rehearsal proof (temporary)

# Runs the rehearsal twice on a push to its own branch: on a build known to break the upgrade,
# where it must fail, and on a build with the fixes, where it must pass. Removed before merging.

on:
  push:
    branches: ['feature/mssql-upgrade-rehearsal']

jobs:
  before-fixes:
    uses: ./.github/workflows/upgrade_rehearsal_sqlserver.yml
    with:
      to_ref: 'f886edaffaac4dbd744f2d87ebd3b9bf17fd29d1'
      expect: 'fail'
  with-fixes:
    uses: ./.github/workflows/upgrade_rehearsal_sqlserver.yml
    with:
      to_ref: 'rehearsal/develop-with-userid-fix'
      expect: 'pass'

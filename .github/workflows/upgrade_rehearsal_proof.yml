name: Upgrade rehearsal proof (temporary)

# Runs the rehearsal on a push to its own branch: on builds known to break the upgrade, where it
# must fail, and on a build with the fixes, where it must pass. Removed before merging.

on:
  push:
    branches: ['feature/mssql-upgrade-rehearsal']

jobs:
  before-fixes:
    uses: ./.github/workflows/upgrade_rehearsal_sqlserver.yml
    with:
      to_ref: 'f886edaffaac4dbd744f2d87ebd3b9bf17fd29d1'
      expect: 'fail'
  before-role-rename-fix:
    uses: ./.github/workflows/upgrade_rehearsal_sqlserver.yml
    with:
      to_ref: 'b3b1ee1d07f0a924e4d5e11261a218f60c68761e'
      expect: 'fail'
  with-fixes:
    uses: ./.github/workflows/upgrade_rehearsal_sqlserver.yml
    with:
      to_ref: 'd21832d885ce3855d7679c56fb6898b703996856'
      expect: 'pass'
